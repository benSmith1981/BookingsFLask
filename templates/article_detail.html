{% extends "base.html" %}
{% block content %}

<div class="container mt-4">

    <!-- Back button -->
    <a href="/education" class="btn btn-secondary mb-3">← Back to Articles</a>

    <div class="card p-4">
        
        <!-- Article Image -->
        <img src="{{ article['image'] or 'https://via.placeholder.com/800x400' }}" 
             class="card-img-top mb-4"
             alt="{{ article['title'] }}">

        <!-- Title -->
        <h2 class="mb-3">{{ article['title'] }}</h2>

        <!-- Summary -->
        <p class="text-muted">{{ article['summary'] }}</p>

        <hr>

        <!-- Full Content -->
        <p style="font-size: 1.1rem; line-height: 1.7;">
            {{ article['content'] }}
        </p>

    </div>

</div>

{% endblock %}
