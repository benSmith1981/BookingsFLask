{% extends "base.html" %}
{% block content %}
<h1>Book Your Visit</h1>

<form method="POST">
    <label for="date">Choose a date:</label><br><br>
    <input type="date" name="date" required><br><br>

    <label for="people">Number of people:</label><br><br>
    <input type="number" name="people" min="1" max="10" required><br><br>

    <button type="submit">Continue</button>
</form>

{% endblock %}
